<!DOCTYPE html>
<html>
<head>
  <!-- Keep all your existing head elements, links, and meta tags exactly as they are -->

  <style>
    /* Turn the entire page black and text white instantly without touching layout, fonts, or image metrics */
    html {
      background-color: #000000 !important;
      filter: invert(1) hue-rotate(180deg) !important;
    }

    /* Keep images and SVGs normal color so they don't look inverted/corrupted */
    img, svg, picture, video {
      filter: invert(1) hue-rotate(180deg) !important;
    }

    /* Print settings: strip the filter so it returns to its natural white background/black text */
    @media print {
      html, img, svg, picture, video {
        filter: none !important;
        background-color: #ffffff !important;
      }
    }
  </style>

</head>
<body>

  <!-- This is where your Jekyll or template engine content gets injected -->
  {{ content }} 

</body>
</html>
