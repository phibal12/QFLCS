<!DOCTYPE html>
<html>
<head>
  <!-- Keep all your existing head elements, links, and meta tags exactly as they are -->

  <style>
    /* 1. FORCE SYSTEM CANVAS TO BLACK FOR DIGITAL VIEWING */
    :root {
      color-scheme: dark;
    }
    
    html, body {
      background-color: #0d1117 !important; /* Authentic GitHub Dark mode color */
      color: #c9d1d9 !important;
    }

    /* 2. RE-ESTABLISH SAFE IMAGE CONTAINMENT */
    /* This overrides the huge image bug, forcing them to match the page text width */
    img, svg, picture, video {
      max-width: 100% !important;
      height: auto !important;
      display: inline-block;
    }

    /* Keep markdown layout wrappers dark */
    .markdown-body, #main_content_wrap, .wrapper, .container-lg {
      background-color: #0d1117 !important;
      color: #c9d1d9 !important;
    }

    /* Safely force standard text headings to stay light grey/white on screen */
    h1, h2, h3, h4, h5, h6, p, li, span, code, a {
      color: #f0f6fc !important;
    }

    /* 3. DYNAMIC PRINT ENVIRONMENT INTERFACES */
    @media print {
      :root {
        color-scheme: light;
      }
      html, body, .markdown-body, #main_content_wrap, .wrapper, .container-lg {
        background-color: #ffffff !important;
        background-image: none !important;
        color: #000000 !important;
      }
      h1, h2, h3, h4, h5, h6, p, li, span, code, a {
        color: #000000 !important;
      }
      img, svg, picture {
        max-width: 100% !important;
        height: auto !important;
        page-break-inside: avoid; /* Keeps layout images from snapping awkwardly across printed page splits */
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>

</head>
<body>

  <!-- This is where your Jekyll or template engine content gets injected -->
  {{ content }} 

</body>
</html>
